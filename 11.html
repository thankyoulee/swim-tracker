<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>11月游泳集训计划与池边双窗间歇表</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Strikethrough on completed task */
    .task-checkbox:checked + div .task-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    /* Rest hotspot badge animation */
    .rest-hotspot {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      font-weight: 800;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
      vertical-align: middle;
      font-size: 11px;
    }
    .dark .rest-hotspot {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
    }
    .rest-hotspot:active {
      transform: scale(0.92);
      background: #10b981;
      color: #fff;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Top Navigation & Date Bar -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm pt-[var(--safe-top)]">
    <div class="px-3.5 py-2.5 flex items-center justify-between max-w-lg mx-auto">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse"></span>
          <h1 class="text-sm font-black tracking-tight text-slate-900 dark:text-white">11月游泳集训计划</h1>
        </div>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">点击计划中的绿色间歇直入秒表</p>
      </div>

      <!-- Header actions: Theme toggle and Week selector -->
      <div class="flex items-center gap-2">
        <select id="weekJumper" class="text-[11px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none">
          <option value="0">第 1 周 (节奏校准)</option>
          <option value="6">第 2 周 (专项推进)</option>
          <option value="12">第 3 周 (容量峰值)</option>
          <option value="18">第 4 周 (调整复测)</option>
          <option value="24">11/30 (收官衔接)</option>
        </select>
        <button id="themeToggleBtn" aria-label="切换主题" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-amber-300">
          <svg id="sunIcon" class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="moonIcon" class="w-4 h-4 block dark:hidden text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Scrollable Horizontal Day Pills -->
    <nav class="border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/70 dark:bg-slate-900/60 px-2 py-1.5">
      <div id="dayTabsContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar scroll-smooth max-w-lg mx-auto px-1">
        <!-- Dynamically rendered -->
      </div>
    </nav>
  </header>

  <!-- Main Training Card Section -->
  <main id="mainCardArea" class="flex-1 max-w-lg w-full mx-auto p-3.5 pb-28">
    <!-- Card Hero Banner -->
    <section id="cardHero" class="bg-gradient-to-br from-slate-900 via-sky-950 to-blue-900 text-white rounded-2xl p-4 shadow-md relative overflow-hidden mb-3">
      <div class="relative z-10 flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <span id="heroPhase" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-sky-500/20 border border-sky-400/30 text-sky-200">第 1 周</span>
          <span id="heroDistance" class="text-xs font-black tracking-tight text-white bg-white/20 backdrop-blur-md px-2.5 py-0.5 rounded-full">4,200m</span>
        </div>
        <h2 id="heroTitle" class="text-base font-black tracking-tight leading-snug mt-0.5">11月2日 (周一) 自由泳持续游校准 + 混合泳四姿转换基础</h2>
        <div class="flex items-center justify-between text-xs text-sky-200/80 pt-1 border-t border-white/10 mt-1">
          <span id="heroDayProgress" class="font-medium text-[11px]">完成度: 0/0 (0%)</span>
          <span class="text-[10px] text-sky-300/80 flex items-center gap-1">
            <span>左右滑屏快速切日 ⇄</span>
          </span>
        </div>
      </div>
      <div class="absolute -right-8 -bottom-8 w-28 h-28 rounded-full bg-cyan-400/15 blur-2xl pointer-events-none"></div>
    </section>

    <!-- Training Item Modules (Checklist) -->
    <div id="modulesContainer" class="space-y-2.5">
      <!-- Dynamic training modules rendered here -->
    </div>

    <!-- Quick Day Switcher & Reset -->
    <div class="flex items-center justify-between gap-2.5 mt-5 px-1">
      <button id="prevDayBtn" class="flex-1 py-2.5 px-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold flex items-center justify-center gap-1 active:bg-slate-100 shadow-sm transition">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span>前一天</span>
      </button>

      <button id="resetChecksBtn" class="px-3 py-2.5 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-semibold active:scale-95 transition">
        重置勾选
      </button>

      <button id="nextDayBtn" class="flex-1 py-2.5 px-3 rounded-xl bg-sky-600 dark:bg-sky-500 text-white text-xs font-bold flex items-center justify-center gap-1 active:bg-sky-700 shadow-sm transition">
        <span>后一天</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <!-- Rest Loaded Toast Notification -->
  <div id="restToast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-1.5 pointer-events-none opacity-0 transition-opacity duration-200">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span id="restToastText">已载入间歇: 30秒</span>
  </div>

  <!-- FLOATING BOTTOM-RIGHT TIMER TRIGGER (FAB) -->
  <aside class="fixed bottom-6 right-5 z-40">
    <button id="fabTimerBtn" class="relative group w-14 h-14 rounded-full bg-gradient-to-tr from-sky-600 to-cyan-500 text-white shadow-xl flex flex-col items-center justify-center active:scale-90 transition-transform">
      <div id="fabPulseRing" class="absolute inset-0 rounded-full bg-sky-400 opacity-0 pointer-events-none"></div>
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="fabTimerText" class="text-[9px] font-black font-mono leading-none mt-0.5">A 00:30</span>
    </button>
  </aside>

  <!-- HALF-SCREEN COLLAPSIBLE REST TIMER DRAWER (半屏尺寸，拒绝铺满) -->
  <div id="timerBackdrop" class="fixed inset-0 z-50 bg-black/45 backdrop-blur-[2px] hidden transition-opacity"></div>
  <div id="timerDrawer" class="fixed inset-x-0 bottom-0 z-50 bg-white dark:bg-slate-900 rounded-t-3xl border-t border-slate-200 dark:border-slate-800 shadow-2xl transition-transform duration-300 translate-y-full flex flex-col max-h-[52vh] sm:max-h-[50vh] overflow-hidden">
    
    <!-- Drawer Top Bar & Collapse Button -->
    <div class="px-4 py-2.5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between shrink-0 bg-slate-50/80 dark:bg-slate-900/80">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-md bg-sky-100 dark:bg-sky-900/50 flex items-center justify-center text-sky-600 dark:text-sky-400">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
        <div>
          <h3 class="font-extrabold text-slate-900 dark:text-white text-xs">池边双窗间歇计时器</h3>
        </div>
      </div>

      <!-- 收纳按键 (大触摸区，点击直接收回右下角) -->
      <button id="collapseTimerBtn" class="flex items-center gap-1 px-3 py-1 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-full text-xs font-black active:scale-95 transition shadow-sm">
        <span>▼ 收纳面板</span>
      </button>
    </div>

    <!-- Scrollable Drawer Content (Half Screen) -->
    <div class="flex-1 overflow-y-auto p-3 space-y-2.5 no-scrollbar">

      <!-- DUAL TIME WINDOWS: A & B CARDS -->
      <div>
        <div class="flex items-center justify-between text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1 px-1">
          <span>点击卡片选择输入目标窗:</span>
          <span id="activeTargetBadge" class="px-2 py-0.5 rounded-full bg-sky-100 dark:bg-sky-900/60 text-sky-700 dark:text-sky-300 font-extrabold">当前设定: 🅰 A 窗</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <!-- Window A -->
          <div id="cardTimerA" class="cursor-pointer relative p-2.5 rounded-2xl border-2 transition-all bg-sky-50/40 dark:bg-sky-950/20 border-sky-500 shadow-sm" onclick="selectTargetWindow('A')">
            <div class="flex items-center justify-between mb-0.5">
              <span class="text-xs font-black flex items-center gap-1 text-sky-600 dark:text-sky-400">
                <span class="w-2 h-2 rounded-full bg-sky-500 inline-block"></span>
                🅰 A 窗 (包干/主跑)
              </span>
              <span id="stateLabelA" class="text-[9px] font-bold px-1 py-0.2 rounded bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300">待出发</span>
            </div>
            <div id="displayA" class="text-2xl sm:text-3xl font-mono font-black text-center text-slate-900 dark:text-sky-300 py-0.5">00:30</div>
            <!-- Sub actions A -->
            <div class="flex items-center justify-center gap-1 text-[10px]">
              <button onclick="event.stopPropagation(); setDuration('A', 1, true)" class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold active:scale-90">+1s</button>
              <button onclick="event.stopPropagation(); setDuration('A', 5, true)" class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold active:scale-90">+5s</button>
              <button onclick="event.stopPropagation(); clearTimerWindow('A')" class="px-1.5 py-0.5 rounded bg-rose-50 dark:bg-rose-950/40 text-rose-600 border border-rose-200 dark:border-rose-800 font-bold active:scale-90">清零</button>
            </div>
            <!-- Toggle Button A -->
            <button id="toggleBtnA" onclick="event.stopPropagation(); toggleTimer('A')" class="w-full mt-1.5 py-1.5 rounded-xl bg-sky-600 text-white text-xs font-black shadow-sm active:scale-95 transition">
              启动 A
            </button>
          </div>

          <!-- Window B -->
          <div id="cardTimerB" class="cursor-pointer relative p-2.5 rounded-2xl border-2 transition-all bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 shadow-sm" onclick="selectTargetWindow('B')">
            <div class="flex items-center justify-between mb-0.5">
              <span class="text-xs font-black flex items-center gap-1 text-amber-600 dark:text-amber-400">
                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                🅱 B 窗 (备战/间歇)
              </span>
              <span id="stateLabelB" class="text-[9px] font-bold px-1 py-0.2 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">待命中</span>
            </div>
            <div id="displayB" class="text-2xl sm:text-3xl font-mono font-black text-center text-slate-900 dark:text-amber-300 py-0.5">00:15</div>
            <!-- Sub actions B -->
            <div class="flex items-center justify-center gap-1 text-[10px]">
              <button onclick="event.stopPropagation(); setDuration('B', 1, true)" class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold active:scale-90">+1s</button>
              <button onclick="event.stopPropagation(); setDuration('B', 5, true)" class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold active:scale-90">+5s</button>
              <button onclick="event.stopPropagation(); clearTimerWindow('B')" class="px-1.5 py-0.5 rounded bg-rose-50 dark:bg-rose-950/40 text-rose-600 border border-rose-200 dark:border-rose-800 font-bold active:scale-90">清零</button>
            </div>
            <!-- Toggle Button B -->
            <button id="toggleBtnB" onclick="event.stopPropagation(); toggleTimer('B')" class="w-full mt-1.5 py-1.5 rounded-xl bg-amber-600 text-white text-xs font-black shadow-sm active:scale-95 transition">
              启动 B
            </button>
          </div>
        </div>

        <!-- Automation & Chaining Mode Options -->
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/50 p-2 rounded-xl text-[10px] font-bold text-slate-600 dark:text-slate-300 mt-1.5">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chainRelayCheckbox" class="rounded text-sky-600 focus:ring-0" checked>
            <span>🔗 接力模式 (A完自动起B)</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="loopCycleCheckbox" class="rounded text-amber-600 focus:ring-0">
            <span>🔄 循环连跑 (A⇄B包干)</span>
          </label>
        </div>
      </div>

      <!-- 3 Rows of Quick Preset Buttons (Accumulative logic supported!) -->
      <div class="space-y-1">
        <div class="text-[10px] font-bold text-slate-400 px-1">快捷间歇 (累计注入当前选中的窗)</div>
        <!-- Row 1: 5, 10, 15, 20 -->
        <div class="grid grid-cols-4 gap-1.5">
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="5">5s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="10">10s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="15">15s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="20">20s</button>
        </div>
        <!-- Row 2: 30, 35, 40, 45 -->
        <div class="grid grid-cols-4 gap-1.5">
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="30">30s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="35">35s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="40">40s</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="45">45s</button>
        </div>
        <!-- Row 3: 1:00, 1:30, 2:00, 2:30 -->
        <div class="grid grid-cols-4 gap-1.5">
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="60">1:00</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="90">1:30</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="120">2:00</button>
          <button class="timer-add-btn py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-sky-500 active:text-white" data-sec="150">2:30</button>
        </div>
      </div>

      <!-- Custom Time Input -->
      <div class="pt-1 border-t border-slate-100 dark:border-slate-800 flex gap-2">
        <input id="customTimeInput" type="text" placeholder="手动输入: 1.35 或 45" class="flex-1 text-xs font-mono font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 outline-none border border-slate-200 dark:border-slate-700 focus:border-sky-500">
        <button id="applyCustomTimeBtn" class="px-3.5 py-1.5 bg-sky-600 text-white text-xs font-bold rounded-xl shrink-0 active:scale-95 transition">设定</button>
      </div>

      <!-- SOUND RINGTONE CUSTOMIZER & RESET SECTION -->
      <div class="p-2 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-1.5">
            <span class="text-xs">🔔</span>
            <span class="text-[11px] font-extrabold text-slate-700 dark:text-slate-200">发令音频管理</span>
          </div>
          <span id="currentSoundStatus" class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400">系统初始发令音</span>
        </div>
        <div class="flex items-center gap-2">
          <input type="file" id="soundFileInput" accept="audio/*" class="hidden">
          <button id="uploadSoundBtn" class="flex-1 py-1 px-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-[10px] font-bold rounded-lg active:scale-95 transition">
            + 添加/更换音频
          </button>
          <button id="previewSoundBtn" class="py-1 px-2.5 bg-sky-100 text-sky-700 dark:bg-sky-900/60 dark:text-sky-300 text-[10px] font-bold rounded-lg active:scale-95 transition">
            试听
          </button>
          <button id="resetSoundBtn" class="hidden py-1 px-2 bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 text-[10px] font-bold rounded-lg active:scale-95 transition">
            恢复默认
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2 pt-1">
        <button id="toggleBothTimerBtn" class="flex-1 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white font-black text-xs active:scale-98 shadow-md transition flex items-center justify-center gap-1.5">

    // Convert rest intervals in text to clickable rest hotspots
    function makeRestHotspots(text) {
      if (!text) return '';
      const pattern = /(?:组间休息|组间转换休息[：:]*|轮间休息|每轮之间休息|两轮间休息|两趟间仅休息|每个之间休息|段间休息|大休|间歇|休|Rest|休息)\s*[:：]?\s*(\d{1,2}[:.]\d{2}|\d+)\s*(s|秒|分钟|分)?/gi;
      return text.replace(pattern, (match, timeStr, unit) => {
        let sec = 0;
        if (timeStr.includes(':') || timeStr.includes('.')) {
          const sep = timeStr.includes(':') ? ':' : '.';
          const parts = timeStr.split(sep);
          sec = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        } else {
          const val = parseInt(timeStr, 10);
          if (unit && (unit.includes('分') || unit.includes('分钟'))) {
            sec = val * 60;
          } else {
            sec = val;
          }
        }
        if (isNaN(sec) || sec <= 0) return match;
        const cleanLabel = match.replace(/'/g, "\\'");
        return `<span class="rest-hotspot" onclick="event.stopPropagation(); loadRestFromHotspot(${sec}, '${cleanLabel}')" title="点击载入秒表">${match} ⏱</span>`;
      });
    }

    function parseDurationToSeconds(str) {
      if (!str) return 0;
      let clean = str.toLowerCase().replace('s', '').replace('秒', '').trim();
      if (clean.includes('分')) return parseInt(clean, 10) * 60;
      if (clean.includes(':')) {
        const parts = clean.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      }
      if (clean.includes('.')) {
        const parts = clean.split('.');
        if (parts.length === 2) {
          return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }
      }
      let val = parseInt(clean, 10);
      return isNaN(val) ? 0 : val;
    }

    function initAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playBeep(freq = 1200, duration = 0.12, type = 'square', volume = 0.95) {
      try {
        initAudioContext();
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch (err) {}
    }

    function playFinishWhistle() {
      try {
        initAudioContext();
        if (!audioContext) return;
        const now = audioContext.currentTime;
        const osc1 = audioContext.createOscillator();
        const osc2 = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(1800, now);
        osc1.frequency.linearRampToValueAtTime(1950, now + 0.65);
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(2400, now);
        osc2.frequency.linearRampToValueAtTime(2600, now + 0.65);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioContext.destination);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.7);
        osc2.stop(now + 0.7);
      } catch (err) {}
    }

    function playCountdownAlert(remainingSec) {
      initAudioContext();
      if (customAudioBlobUrl) {
        try {
          customAudio.currentTime = 0;
          customAudio.play().catch(() => playSynthCountdownTick(remainingSec));
          return;
        } catch (e) {}
      }

      if (!mp3Failed) {
        try {
          const offset = Math.max(0, 6 - remainingSec);
          countdownAudio.currentTime = offset;
          countdownAudio.play().catch(() => {
            mp3Failed = true;
            playSynthCountdownTick(remainingSec);
          });
          return;
        } catch (e) {
          mp3Failed = true;
        }
      }
      playSynthCountdownTick(remainingSec);
    }

    function playSynthCountdownTick(sec) {
      if (sec >= 1 && sec <= 5) {
        const pitch = 850 + (5 - sec) * 140;
        playBeep(pitch, 0.14, 'square', 0.95);
      }
    }

    function stopAllAudio() {
      try {
        countdownAudio.pause();
        countdownAudio.currentTime = 0;
      } catch (e) {}

      } catch (e) {}

    window.toggleTimer = function(win) {
      if (timerState[win].running) {
        pauseTimer(win);

        if (timerState[win].seconds === 0) {
          timerState[win].seconds = timerState[win].initial || 30;

    function startTimer(win) {
      const t = timerState[win];
      if (t.running || t.seconds <= 0) return;
      initAudioContext();
      t.running = true;
      t.audioPlayed = false;

      const btn = win === 'A' ? toggleBtnA : toggleBtnB;
      const label = win === 'A' ? stateLabelA : stateLabelB;
      btn.textContent = `暂停 ${win}`;
      btn.classList.replace('bg-sky-600', 'bg-rose-600');
      btn.classList.replace('bg-amber-600', 'bg-rose-600');
      label.textContent = "正在计时...";

      checkFabPulse();

      if (t.seconds <= 5) {
        t.audioPlayed = true;
        playCountdownAlert(t.seconds);
      }

      t.interval = setInterval(() => {
        if (t.seconds > 0) {
          t.seconds--;
          updateWindowDisplay(win);

          if (t.seconds === 5 && !t.audioPlayed) {
            t.audioPlayed = true;
            playCountdownAlert(5);
          } else if (t.seconds > 0 && t.seconds < 5) {
            label.textContent = `剩 ${t.seconds} 秒准备！`;
            if (mp3Failed && !customAudioBlobUrl) {
              playSynthCountdownTick(t.seconds);
            }
          }

          if (t.seconds === 0) {
            clearInterval(t.interval);
            t.running = false;
            btn.textContent = `启动 ${win}`;
            btn.classList.replace('bg-rose-600', win === 'A' ? 'bg-sky-600' : 'bg-amber-600');
            label.textContent = "出发！完工";
            checkFabPulse();

            if (!customAudioBlobUrl && mp3Failed) {
              playFinishWhistle();
            }
            if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 500]);

            handleChainingAfterFinish(win);
          }
        }
      }, 1000);
    }

    function pauseTimer(win) {
      const t = timerState[win];
      clearInterval(t.interval);
      t.running = false;
      const btn = win === 'A' ? toggleBtnA : toggleBtnB;
      const label = win === 'A' ? stateLabelA : stateLabelB;
      btn.textContent = `启动 ${win}`;
      btn.classList.replace('bg-rose-600', win === 'A' ? 'bg-sky-600' : 'bg-amber-600');
      if (t.seconds > 0) label.textContent = "已暂停";
      checkFabPulse();
      updateFabText();
    }

    function handleChainingAfterFinish(finishedWin) {
      const isRelay = chainRelayCheckbox.checked;
      const isLoop = loopCycleCheckbox.checked;

      if (finishedWin === 'A') {
        if (isRelay || isLoop) {
          showToast('🅰 窗完成！正在接力启动 🅱 窗...');
          setTimeout(() => {
            if (timerState.B.seconds === 0) timerState.B.seconds = timerState.B.initial || 15;
            startTimer('B');
          }, 600);
        }
      } else if (finishedWin === 'B') {
        if (isLoop) {
          showToast('🅱 窗完成！正在循环重启 🅰 窗包干...');
          setTimeout(() => {
            timerState.A.seconds = timerState.A.initial || 30;
            updateWindowDisplay('A');
            startTimer('A');
          }, 600);
        }
      }
    }

    function checkFabPulse() {
      if (timerState.A.running || timerState.B.running) {
        fabPulseRing.classList.remove('opacity-0');
        fabPulseRing.classList.add('pulse-ring', 'opacity-80');
      } else {
        fabPulseRing.classList.remove('pulse-ring', 'opacity-80');
        fabPulseRing.classList.add('opacity-0');
      }
    }

    toggleBothTimerBtn.addEventListener('click', () => {
      initAudioContext();
      if (timerState.A.running || timerState.B.running) {
        pauseTimer('A');
        pauseTimer('B');
      } else {
        if (timerState.A.seconds === 0) timerState.A.seconds = timerState.A.initial || 30;
        if (timerState.B.seconds === 0) timerState.B.seconds = timerState.B.initial || 15;
        startTimer('A');
        startTimer('B');
      }
    });

    resetAllTimersBtn.addEventListener('click', () => {
      pauseTimer('A');
      pauseTimer('B');
      stopAllAudio();
      timerState.A.seconds = timerState.A.initial || 30;
      timerState.B.seconds = timerState.B.initial || 15;
      stateLabelA.textContent = "已重置";
      stateLabelB.textContent = "已重置";
      updateWindowDisplay('A');
      updateWindowDisplay('B');
    });

    // Preset button accumulation logic for active target window
    document.querySelectorAll('.timer-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sec = parseInt(btn.dataset.sec, 10);
        if (timerState[activeTarget].seconds === 0) {
          setDuration(activeTarget, sec, false);
        } else {
          setDuration(activeTarget, sec, true);
        }
      });
    });

    // Custom time input: e.g. "1.35" -> 95s
    applyCustomTimeBtn.addEventListener('click', () => {
      const val = customTimeInput.value.trim();
      if (!val) return;
      const sec = parseDurationToSeconds(val);
      if (sec > 0) {
        setDuration(activeTarget, sec, false);
        customTimeInput.value = '';
        showToast(`已设定到 ${activeTarget === 'A' ? '🅰 A 窗' : '🅱 B 窗'}: ${formatTime(sec)}`);
      }
    });

    // ==========================================
    // 5. HALF-SCREEN DRAWER OPEN & COLLAPSE
    // ==========================================

    function openTimerDrawer() {
      timerBackdrop.classList.remove('hidden');
      timerDrawer.classList.remove('translate-y-full');
      timerDrawer.classList.add('translate-y-0');
    }

    function closeTimerDrawer() {
      timerDrawer.classList.remove('translate-y-0');
      timerDrawer.classList.add('translate-y-full');
      setTimeout(() => {
        timerBackdrop.classList.add('hidden');
      }, 250);
    }

    fabTimerBtn.addEventListener('click', openTimerDrawer);
    collapseTimerBtn.addEventListener('click', closeTimerDrawer);
    timerBackdrop.addEventListener('click', closeTimerDrawer);

    // ==========================================
    // 6. SWIPE, NAVIGATION & INITIALIZATION
    // ==========================================

    // Prev / Next Buttons
    prevDayBtn.addEventListener('click', () => {
      if (currentDayIndex > 0) {
        currentDayIndex--;
        renderDayCard();
        scrollActiveTabIntoView();
        syncWeekJumper();
      }
    });

    nextDayBtn.addEventListener('click', () => {
      if (currentDayIndex < novemberData.length - 1) {
        currentDayIndex++;
        renderDayCard();
        scrollActiveTabIntoView();
        syncWeekJumper();
      }
    });

    resetChecksBtn.addEventListener('click', () => {
      const day = novemberData[currentDayIndex];
      day.modules.forEach((mod, mIdx) => {
        mod.items.forEach((_, iIdx) => {
          delete completedTasks[`${currentDayIndex}-${mIdx}-${iIdx}`];
        });
      });
      renderDayCard();
      showToast('今日任务已重置勾选');
    });

    weekJumper.addEventListener('change', (e) => {
      currentDayIndex = parseInt(e.target.value, 10);
      renderDayCard();
      scrollActiveTabIntoView();
    });

    // Swipe gesture support on card area
    mainCardArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    mainCardArea.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // Ensure horizontal swipe dominant
      if (Math.abs(diffX) > 55 && Math.abs(diffY) < 40) {
        if (diffX < 0 && currentDayIndex < novemberData.length - 1) {
          // Swipe left -> Next day
          currentDayIndex++;
          renderDayCard();
          scrollActiveTabIntoView();
          syncWeekJumper();
        } else if (diffX > 0 && currentDayIndex > 0) {
          // Swipe right -> Prev day
          currentDayIndex--;
          renderDayCard();
          scrollActiveTabIntoView();
          syncWeekJumper();
        }
      }
    }, { passive: true });

    // Theme Toggle
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // App Startup
    renderDayCard();
    scrollActiveTabIntoView();
    updateWindowDisplay('A');
    updateWindowDisplay('B');
  </script>
</body>
</html>
